# Build image trên GitHub Actions và push lên GitHub Container Registry (GHCR).
#
# Kết quả: ghcr.io/realldz/huce-bot với các tag: latest (nhánh main), main,
# v1.2.3 (khi push git tag), sha-<commit>.
#
# Không cần tạo secret nào: workflow dùng GITHUB_TOKEN có sẵn của repo.
# Image KHÔNG chứa bí mật: .env và *.db nằm trong .dockerignore, nên token chỉ được
# truyền vào container lúc chạy (env_file của docker-compose.yml trên server).

name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository = realldz/huce-bot (GHCR yêu cầu tên image viết thường)
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout mã nguồn
      packages: write # push image lên GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Bỏ qua trên pull request: PR từ fork không có quyền ghi package.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sinh tag + label, trong đó có org.opencontainers.image.source để package
      # được liên kết với repo này.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Trên PR chỉ build để kiểm tra Dockerfile, không push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mặc định chỉ linux/amd64 (Windows, hầu hết VPS).
          # Muốn thêm ARM (Oracle Cloud ARM, Raspberry Pi): đổi thành
          # "linux/amd64,linux/arm64" và thêm bước docker/setup-qemu-action@v3
          # trước bước login - build sẽ lâu hơn đáng kể.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
